name: Actualizar museos desde OSM

on:
  schedule:
    # Cada 15 minutos, lejos del minuto 00 (la hora en punto es cuando GitHub más retrasa
    # o descarta ejecuciones programadas).
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-museos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 14   # menos que el intervalo, para no encimarse con la siguiente
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Consultar Overpass y regenerar data/museos.geojson
        run: node scripts/actualizar_museos.mjs

      - name: Subir el archivo si cambió
        run: |
          if git diff --quiet -- data/museos.geojson; then
            echo "Sin cambios en los museos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/museos.geojson
          git commit -m "Actualizar museos desde OpenStreetMap"
          # Si alguien subió algo a main mientras corría, se pone encima en vez de fallar.
          git pull --rebase origin main
          git push
