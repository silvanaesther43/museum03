name: Actualizar museos desde OSM

on:
  schedule:
    - cron: '17 */6 * * *'   # cada 6 horas (UTC)
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-museos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar Overpass y regenerar data/museos.geojson
        run: node scripts/actualizar_museos.mjs

      - name: Subir el archivo si cambió
        run: |
          if git diff --quiet -- data/museos.geojson; then
            echo "Sin cambios en los museos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/museos.geojson
          git commit -m "Actualizar museos desde OpenStreetMap"
          git push
